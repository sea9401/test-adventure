# PR·main push 에서 타입·린트·테스트·운영 의존성 감사·프로덕션 빌드를 검증한다.
# 머지 게이트: ruleset 'main-ci-gate'(repo → Settings → Rules) 가 이 'check' 잡 통과를
# main 머지 필수로 강제한다(public 전환 후 활성). 게이트를 잠깐 풀려면 그 ruleset 을 Disabled 로.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# 같은 ref 의 이전 실행 취소 — 연속 push 비용 절약.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: browser_e2e
          POSTGRES_PASSWORD: browser_e2e
          POSTGRES_DB: adventure_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_e2e -d adventure_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 아래 값은 이 잡과 함께 폐기되는 로컬 컨테이너 전용이며 운영 비밀이 아니다.
      DATABASE_URL: postgresql://browser_e2e:browser_e2e@127.0.0.1:5432/adventure_e2e
      DATABASE_TLS_DISABLED_FOR_LOCAL_TESTS: "true"
      E2E_TEST_LOGIN_ID: browser-e2e
      E2E_TEST_PASSWORD: browser-e2e-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Secret leak guard
        run: npm run check-secrets
      - run: npm ci
      - name: Image refs (check-images)
        run: npm run check-images
      - name: Static asset rights ledger
        run: npm run check-asset-rights -- --strict
      - name: Dependency licenses and notices
        run: npm run check-licenses
      - name: Migration journal order
        run: npm run check-migrations
      - name: Migrate and seed browser E2E database
        run: npm run test:e2e:db:setup
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      # ESLint — 에러 시 실패(경고는 비차단). 린트 부채 누적 방지 게이트.
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npx vitest run
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Production build
        env:
          # 운영 배포가 요청한 전체 SHA와 클라이언트 번들의 버전 식별자를 일치시킨다.
          BUILD_ID: ${{ github.sha }}
        run: npm run build
      - name: Prepare immutable production build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node scripts/prepare-production-artifact.mjs .next "$DEPLOY_SHA"
          mkdir -p production-release
          tar \
            --exclude='./cache' \
            --exclude='./dev' \
            -C .next \
            -czf production-release/production-next.tar.gz \
            .
          (
            cd production-release
            sha256sum production-next.tar.gz > production-next.tar.gz.sha256
          )
      # GitHub hosted runner는 매 실행마다 초기화된다. 브라우저 바이너리를 캐시해
      # PR CI에서 받은 동일 Playwright 버전을 main CI가 다시 내려받지 않게 한다.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # 시스템 패키지와 브라우저 다운로드를 분리해 지연 원인을 로그에서 구분한다.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        timeout-minutes: 20
        run: npx playwright install chromium webkit
      - name: Browser E2E and accessibility
        run: npm run test:e2e
      # E2E까지 성공한 main SHA만 운영 배포 후보가 된다. tar 내부는 Next 파일 권한과
      # node_modules 상대 심볼릭 링크를 보존하고, GitHub 아티팩트는 불변으로 저장된다.
      - name: Upload production build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: production-next-${{ github.sha }}
          path: production-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Playwright failure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
