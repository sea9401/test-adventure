# PR·main push에서 정적 검사·단위 테스트·운영 빌드·브라우저 E2E를 병렬 검증한다.
# 머지 게이트: ruleset 'main-ci-gate'(repo → Settings → Rules)는 마지막 'check' 잡을
# 필수 상태 검사로 사용한다. 개별 잡을 분리해 실패한 영역만 다시 실행할 수 있게 한다.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# 같은 ref의 이전 실행 취소 — 연속 push 비용 절약.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Secret leak guard
        run: npm run check-secrets
      - name: Immutable workflow action references
        run: npm run check-action-pins
      - name: Image refs (check-images)
        run: npm run check-images
      - name: Static asset rights ledger
        run: npm run check-asset-rights -- --strict
      - name: Dependency licenses and notices
        run: npm run check-licenses
      - name: Migration journal and destructive SQL guard
        run: npm run check-migrations
      - name: Large module no-growth budgets
        run: npm run check-module-budgets
      - name: Typecheck (tsc --noEmit)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx tsc --noEmit
      # ESLint — 에러 시 실패(경고는 비차단). 린트 부채 누적 방지 게이트.
      - name: Lint (eslint)
        run: npm run lint

  # npm ci의 반복 감사를 끄고 운영 lockfile은 npm 권고도 수집하는 GitHub의
  # Advisory Database에서 한 번 검사한다. 레지스트리 감사 API 장애와 설치를 피한다.
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Production dependency audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-advisories.mjs

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
      # 장시간 결정적 시뮬레이션은 별도 단일-worker 잡에서 검증한다. 나머지는 세
      # runner에 결정적으로 나눠 전체 테스트를 유지하면서 임계 경로를 줄인다.
      - name: Tests (vitest)
        run: npx vitest run --exclude src/adventure/data/v2/levelDesignSim.test.ts --shard=${{ matrix.shard }}/3

  level-design-sim-tests:
    name: Level design simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Deterministic level design simulation
        run: npx vitest run src/adventure/data/v2/levelDesignSim.test.ts --maxWorkers=1

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Production build
        env:
          # 운영 배포가 요청한 전체 SHA와 클라이언트 번들의 버전 식별자를 일치시킨다.
          BUILD_ID: ${{ github.sha }}
        run: npm run build
      - name: Prepare immutable production build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node scripts/prepare-production-artifact.mjs .next "$DEPLOY_SHA"
          mkdir -p production-release
          tar \
            --exclude='./cache' \
            --exclude='./dev' \
            -C .next \
            -czf production-release/production-next.tar.gz \
            .
          (
            cd production-release
            sha256sum production-next.tar.gz > production-next.tar.gz.sha256
          )
      # 이 산출물이 먼저 올라가더라도 deploy.yml은 전체 CI가 성공한 실행만 선택한다.
      # 따라서 정확한 main SHA와 모든 검증을 통과한 빌드만 운영 배포 후보가 된다.
      - name: Upload production build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-next-${{ github.sha }}
          path: production-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    # 브라우저와 Ubuntu 시스템 의존성이 포함된 공식 이미지를 프로젝트 버전과 고정한다.
    # 운영체제 패키지 181개를 매 실행마다 apt로 설치하던 병목과 미러 장애를 제거한다.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: browser_e2e
          POSTGRES_PASSWORD: password
          POSTGRES_DB: adventure_e2e
        options: >-
          --health-cmd "pg_isready -U browser_e2e -d adventure_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 잡과 함께 폐기되는 격리 컨테이너 전용 값이며 운영 비밀이 아니다.
      # 컨테이너 잡에서는 서비스 컨테이너 이름으로 직접 접속한다.
      DATABASE_URL: postgresql://browser_e2e:password@postgres:5432/adventure_e2e
      DATABASE_TLS_DISABLED_FOR_LOCAL_TESTS: "true"
      E2E_TEST_LOGIN_ID: browser-e2e
      E2E_TEST_PASSWORD: browser-e2e-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Verify Playwright image and package versions match
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.62.0"
      - name: Migrate and seed browser E2E database
        run: npm run test:e2e:db:setup
      # E2E 잡을 독립적으로 재실행할 수 있도록 자체 빌드를 사용한다. 별도 production-build
      # 잡과 병렬로 실행되므로 전체 대기시간에는 두 빌드 시간이 중첩된다.
      - name: Build E2E application
        env:
          BUILD_ID: ${{ github.sha }}
        run: npm run build
      - name: Browser E2E and accessibility
        run: npm run test:e2e
      - name: Upload Playwright failure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # 기존 ruleset이 요구하는 상태 검사 이름을 유지하는 집계 잡이다.
  check:
    name: check
    if: ${{ always() }}
    needs: [static-checks, production-audit, unit-tests, level-design-sim-tests, production-build, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          PRODUCTION_AUDIT_RESULT: ${{ needs.production-audit.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          LEVEL_DESIGN_SIM_TESTS_RESULT: ${{ needs.level-design-sim-tests.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production-build.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          test "$STATIC_CHECKS_RESULT" = "success"
          test "$PRODUCTION_AUDIT_RESULT" = "success"
          test "$UNIT_TESTS_RESULT" = "success"
          test "$LEVEL_DESIGN_SIM_TESTS_RESULT" = "success"
          test "$PRODUCTION_BUILD_RESULT" = "success"
          test "$BROWSER_E2E_RESULT" = "success"
