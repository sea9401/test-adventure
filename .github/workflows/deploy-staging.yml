name: Deploy staging to EC2

# staging 브랜치 CI를 통과한 정확한 SHA만 test.msmsge.com에 자동 배포한다.
# 운영과 같은 EC2를 쓰므로 deploy-ec2 concurrency로 운영 배포와 빌드가 겹치지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: test.msmsge.com
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: SSH & deploy [staging]
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_SHA
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/adventure-rpg-test
            git fetch --prune \
              "https://x-access-token:${GH_TOKEN}@github.com/sea9401/test-adventure.git" \
              "+refs/heads/staging:refs/remotes/origin/staging"
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/staging
            git checkout --detach --force "$DEPLOY_SHA"
            DEPLOY_SHA="$DEPLOY_SHA" bash deploy/deploy-staging.sh
      - name: Verify public staging surface
        run: |
          test "$(curl -fsS https://test.msmsge.com/api/health | jq -r .ok)" = "true"
          test "$(curl -fsS https://test.msmsge.com/api/version | jq -r .buildId)" = "$DEPLOY_SHA"
