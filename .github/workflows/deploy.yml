name: Deploy to EC2

# main CI를 통과한 정확한 SHA를 운영자가 정기 업데이트 시간에 수동 배포한다.
# main push만으로 운영 서버를 자동 변경하지 않는다. staging 자동 배포는 별도
# deploy-staging.yml이 담당한다.
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST    — EC2 의 고정 IP 또는 도메인 (예: 54.180.28.29)
#   EC2_SSH_KEY — EC2 접속용 private key 전체 (msmsge-key.pem 의 내용)
#   OPS_ALERT_WEBHOOK_URL — 외부 공개 표면 검사 실패 알림 전용(선택)
#   WEB_PUSH_VAPID_PUBLIC_KEY, WEB_PUSH_VAPID_PRIVATE_KEY, WEB_PUSH_SUBJECT
#   REFERRAL_IDENTITY_SECRET — 탈퇴·재가입 홍보 보상 중복 방지 HMAC 키
# 일반 앱 런타임 비밀값은 EC2에서 SSM을 읽고, 위 배포 전용 키는 GitHub 환경
# 비밀값에서 서버의 접근 제한 파일로 설치한다.
on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "CI를 통과한 main의 전체 40자리 commit SHA"
        required: true
        type: string

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  verify-main-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
    outputs:
      ci_run_id: ${{ steps.ci-run.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
      - name: Verify exact main revision
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
      # 검증과 빌드를 다시 하지 않고, 정확히 이 SHA로 성공한 main push CI만 신뢰한다.
      - name: Locate successful main CI artifact
        id: ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ci_run_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$DEPLOY_SHA&per_page=10" \
              --jq '.workflow_runs[0].id // empty'
          )"
          test -n "$ci_run_id"

          artifact_name="production-next-$DEPLOY_SHA"
          artifact_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/artifacts" \
              --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id" \
              | head -n 1
          )"
          test -n "$artifact_id"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "✓ successful main CI run $ci_run_id has artifact $artifact_id"

  deploy:
    needs: [verify-main-ci]
    runs-on: ubuntu-latest
    environment: msmsge.com
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
    # private repo fetch 용 GITHUB_TOKEN 에 contents:read 보장.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Download exact CI production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-next-${{ env.DEPLOY_SHA }}
          path: production-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-main-ci.outputs.ci_run_id }}
      - name: Verify downloaded production build
        run: |
          cd production-release
          sha256sum --check production-next.tar.gz.sha256
      # 전송과 체크섬 검증은 운영 점검 모드를 켜기 전에 끝낸다.
      - name: Transfer production build to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "production-release/*"
          target: "/home/ec2-user/adventure-release-artifacts/${{ env.DEPLOY_SHA }}"
          strip_components: 1
      - name: SSH & deploy [prod]
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
          REFERRAL_IDENTITY_SECRET: ${{ secrets.REFERRAL_IDENTITY_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_SHA,WEB_PUSH_VAPID_PUBLIC_KEY,WEB_PUSH_VAPID_PRIVATE_KEY,WEB_PUSH_SUBJECT,REFERRAL_IDENTITY_SECRET
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/adventure-rpg
            echo "▶ [prod] git update"
            # repo private — 박스 SSH origin 은 비대화형 deploy 컨텍스트에 키가 없어 fetch 실패.
            # runner 의 GITHUB_TOKEN(ephemeral, contents:read)으로 HTTPS fetch 해 우회.
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/sea9401/test-adventure.git" "+refs/heads/main:refs/remotes/origin/main"
            git checkout --detach --force "$DEPLOY_SHA"
            release_dir="/home/ec2-user/adventure-release-artifacts/$DEPLOY_SHA"
            PRODUCTION_BUILD_ARCHIVE="$release_dir/production-next.tar.gz"
            PRODUCTION_BUILD_CHECKSUM="$release_dir/production-next.tar.gz.sha256"
            export PRODUCTION_BUILD_ARCHIVE PRODUCTION_BUILD_CHECKSUM
            push_env_file=""
            cleanup_release_artifact() {
              if [ -n "$push_env_file" ]; then
                rm -f "$push_env_file"
              fi
              rm -f "$PRODUCTION_BUILD_ARCHIVE" "$PRODUCTION_BUILD_CHECKSUM"
              rmdir "$release_dir" 2>/dev/null || true
            }
            trap cleanup_release_artifact EXIT
            test -n "$WEB_PUSH_VAPID_PUBLIC_KEY"
            test -n "$WEB_PUSH_VAPID_PRIVATE_KEY"
            test -n "$WEB_PUSH_SUBJECT"
            test -n "$REFERRAL_IDENTITY_SECRET"
            sudo install -d -o root -g ec2-user -m 0750 /etc/adventure-rpg
            push_env_file="$(mktemp)"
            chmod 0600 "$push_env_file"
            printf 'WEB_PUSH_VAPID_PUBLIC_KEY=%s\nWEB_PUSH_VAPID_PRIVATE_KEY=%s\nWEB_PUSH_SUBJECT=%s\nREFERRAL_IDENTITY_SECRET=%s\n' \
              "$WEB_PUSH_VAPID_PUBLIC_KEY" \
              "$WEB_PUSH_VAPID_PRIVATE_KEY" \
              "$WEB_PUSH_SUBJECT" \
              "$REFERRAL_IDENTITY_SECRET" > "$push_env_file"
            sudo install -o root -g ec2-user -m 0640 "$push_env_file" \
              /etc/adventure-rpg/web-push.env
            rm -f "$push_env_file"
            PRODUCTION_ENV_PATH=/run/adventure-rpg/production.env
            export PRODUCTION_ENV_PATH
            bash deploy/release-production.sh
      - name: Verify deployment remains in maintenance
        env:
          PUBLIC_RELEASE_EXPECTED_BUILD_ID: ${{ env.DEPLOY_SHA }}
          PUBLIC_RELEASE_MAINTENANCE_POLICY: require
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: npm run check-public-release
