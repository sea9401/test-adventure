name: Deploy to EC2

# main CI를 통과한 정확한 SHA를 운영자가 정기 업데이트 시간에 수동 배포한다.
# main push만으로 운영 서버를 자동 변경하지 않는다. staging 자동 배포는 별도
# deploy-staging.yml이 담당한다.
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST    — EC2 의 고정 IP 또는 도메인 (예: 54.180.28.29)
#   EC2_SSH_KEY — EC2 접속용 private key 전체 (msmsge-key.pem 의 내용)
#   OPS_ALERT_WEBHOOK_URL — 외부 공개 표면 검사 실패 알림 전용(선택)
# 앱 런타임 비밀값은 EC2에서 SSM /adventure-rpg/production/env를 직접 읽는다.
on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "CI를 통과한 main의 전체 40자리 commit SHA"
        required: true
        type: string

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  verify-manual:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
      - name: Verify exact main revision
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check-images
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  deploy:
    needs: [verify-manual]
    runs-on: ubuntu-latest
    environment: msmsge.com
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
    # private repo fetch 용 GITHUB_TOKEN 에 contents:read 보장.
    permissions:
      contents: read
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: SSH & deploy [prod]
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_SHA
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/adventure-rpg
            echo "▶ [prod] git update"
            # repo private — 박스 SSH origin 은 비대화형 deploy 컨텍스트에 키가 없어 fetch 실패.
            # runner 의 GITHUB_TOKEN(ephemeral, contents:read)으로 HTTPS fetch 해 우회.
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/sea9401/test-adventure.git" "+refs/heads/main:refs/remotes/origin/main"
            git checkout --detach --force "$DEPLOY_SHA"
            PRODUCTION_ENV_PATH=/run/adventure-rpg/production.env
            export PRODUCTION_ENV_PATH
            bash deploy/release-production.sh
      - name: Verify public release surface
        env:
          PUBLIC_RELEASE_EXPECTED_BUILD_ID: ${{ env.DEPLOY_SHA }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: npm run check-public-release
