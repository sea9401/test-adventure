name: Deploy to EC2

# main 에 push 되면 EC2 로 SSH 접속해 prod (~/adventure-rpg) 코드 갱신 + 재빌드 + 재시작.
# v2 운영 승격 후 prod-only. 옛 staging(~/adventure-rpg-test) 단계는 제거했다 — staging 이
# 운영 DB(test_adventurerpg)와 분리된 자체 DB 를 받기 전까지 자동배포 대상에서 빼둔다.
# (재도입 시 deploy-test.sh 가 운영 DB 를 건드리지 않도록 별도 DB 가드 먼저.)
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST    — EC2 의 고정 IP 또는 도메인 (예: 54.180.28.29)
#   EC2_SSH_KEY — EC2 접속용 private key 전체 (msmsge-key.pem 의 내용)
on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행 버튼

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # private repo fetch 용 GITHUB_TOKEN 에 contents:read 보장.
    permissions:
      contents: read
    steps:
      # ──────────────────────────────────────────────────────────────────
      # prod 배포 — 실패 시 워크플로 전체 실패. 91fb8d2 까지 잘 돌던 원형 스크립트
      # 를 그대로 유지 (multi-line if/subshell 을 끼우니 prod 헬스 직후 SSH 세션이
      # silent 하게 끊겨 워크플로가 빨간불이 되는 케이스가 발생 — #93 이후 두 번).
      # ──────────────────────────────────────────────────────────────────
      - name: SSH & deploy [prod]
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/adventure-rpg
            echo "▶ [prod] git update"
            # repo private — 박스 SSH origin 은 비대화형 deploy 컨텍스트에 키가 없어 fetch 실패.
            # runner 의 GITHUB_TOKEN(ephemeral, contents:read)으로 HTTPS fetch 해 우회.
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/sea9401/test-adventure.git" "+refs/heads/main:refs/remotes/origin/main"
            git checkout main
            git reset --hard origin/main
            echo "▶ [prod] nginx rate limit"
            bash deploy/apply-nginx-rate-limit.sh
            echo "▶ [prod] deps"
            bash deploy/install-deps.sh
            echo "▶ [prod] db migrate"
            node --env-file=.env.production.local src/db/migrate.mjs
            echo "▶ [prod] clean previous Next build"
            rm -rf .next
            echo "▶ [prod] build"
            NODE_OPTIONS=--max-old-space-size=2048 npm run build
            echo "▶ [prod] restart"
            sudo systemctl restart adventure-rpg
            sleep 2
            sudo systemctl --no-pager status adventure-rpg | head -n 4
            echo "▶ [prod] smoke — 라이브가 진짜 살아있는지 검증(실패 시 배포 빨간불 → rollback.sh)"
            ok=0
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/api/health || echo 000)
              if [ "$code" = "200" ]; then ok=1; echo "  health 200 (try $i)"; break; fi
              echo "  health $code — 부팅 대기 $i/20"; sleep 3
            done
            [ "$ok" = "1" ] || { echo "✗ SMOKE FAIL: /api/health 가 200 이 아님 (앱 미기동/DB 단절)"; exit 1; }
            sc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/sign-in || echo 000)
            [ "$sc" = "200" ] || { echo "✗ SMOKE FAIL: /sign-in → $sc"; exit 1; }
            echo "  /sign-in 200"
            echo "✓ [prod] smoke pass · done"
