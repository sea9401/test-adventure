name: Deploy to EC2

# main CI가 성공하면 그 검증된 SHA만 EC2에 배포한다. 수동 실행도 runner에서 같은
# 출시 검증을 먼저 통과해야 한다.
# v2 운영 승격 후 prod-only. 옛 staging(~/adventure-rpg-test) 단계는 제거했다 — staging 이
# 운영 DB(test_adventurerpg)와 분리된 자체 DB 를 받기 전까지 자동배포 대상에서 빼둔다.
# (재도입 시 deploy-test.sh 가 운영 DB 를 건드리지 않도록 별도 DB 가드 먼저.)
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST    — EC2 의 고정 IP 또는 도메인 (예: 54.180.28.29)
#   EC2_SSH_KEY — EC2 접속용 private key 전체 (msmsge-key.pem 의 내용)
#   TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY — Cloudflare Turnstile 위젯 키
#   HCAPTCHA_SITE_KEY, HCAPTCHA_SECRET_KEY — 강신호용 2단계 CAPTCHA 키(선택)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME — 길드 엠블럼 저장소
#   OPS_ALERT_WEBHOOK_URL — 운영 이상 신호·크론 실패 수신 webhook(선택)
#   REVIEW_LOGIN_ID, REVIEW_LOGIN_PASSWORD, REVIEW_LOGIN_USER_EMAIL — 심사용 기존 카카오 계정 로그인(선택, 세 값 함께 설정)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # 수동 실행 버튼

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  verify-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check-images
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  deploy:
    needs: [verify-manual]
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.verify-manual.result == 'success'))
    runs-on: ubuntu-latest
    environment: msmsge.com
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    # private repo fetch 용 GITHUB_TOKEN 에 contents:read 보장.
    permissions:
      contents: read
    steps:
      # ──────────────────────────────────────────────────────────────────
      # prod 배포 — 실패 시 워크플로 전체 실패. 91fb8d2 까지 잘 돌던 원형 스크립트
      # 를 그대로 유지 (multi-line if/subshell 을 끼우니 prod 헬스 직후 SSH 세션이
      # silent 하게 끊겨 워크플로가 빨간불이 되는 케이스가 발생 — #93 이후 두 번).
      # ──────────────────────────────────────────────────────────────────
      - name: SSH & deploy [prod]
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_EXPECTED_HOSTNAMES: msmsge.com,www.msmsge.com
          HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
          HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          REVIEW_LOGIN_ID: ${{ secrets.REVIEW_LOGIN_ID }}
          REVIEW_LOGIN_PASSWORD: ${{ secrets.REVIEW_LOGIN_PASSWORD }}
          REVIEW_LOGIN_USER_EMAIL: ${{ secrets.REVIEW_LOGIN_USER_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_SHA,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,TURNSTILE_EXPECTED_HOSTNAMES,HCAPTCHA_SITE_KEY,HCAPTCHA_SECRET_KEY,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,OPS_ALERT_WEBHOOK_URL,REVIEW_LOGIN_ID,REVIEW_LOGIN_PASSWORD,REVIEW_LOGIN_USER_EMAIL
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/adventure-rpg
            echo "▶ [prod] git update"
            # repo private — 박스 SSH origin 은 비대화형 deploy 컨텍스트에 키가 없어 fetch 실패.
            # runner 의 GITHUB_TOKEN(ephemeral, contents:read)으로 HTTPS fetch 해 우회.
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/sea9401/test-adventure.git" "+refs/heads/main:refs/remotes/origin/main"
            git checkout --detach --force "$DEPLOY_SHA"
            echo "▶ [prod] cleanup stale Next builds"
            # SSH command timeout 뒤 원격에 남은 빌드가 다음 배포와 메모리를 다투지 않게 한다.
            pkill -f '[n]ext build' || true
            echo "▶ [prod] sync anti-macro environment"
            node scripts/sync-production-turnstile-env.mjs .env.production.local
            echo "▶ [prod] install AWS RDS CA bundle"
            DATABASE_CA_CERT_PATH=$(grep '^DATABASE_CA_CERT_PATH=' .env.production.local | cut -d= -f2- | tr -d '"')
            export DATABASE_CA_CERT_PATH
            bash deploy/install-rds-ca.sh
            echo "▶ [prod] anti-macro env preflight"
            node --env-file=.env.production.local scripts/check-production-env.mjs
            echo "▶ [prod] nginx maintenance on"
            bash deploy/maintenance.sh on
            trap 'bash deploy/maintenance.sh off || true' EXIT
            echo "▶ [prod] deps"
            bash deploy/install-deps.sh
            echo "▶ [prod] build"
            bash deploy/build-production.sh
            echo "▶ [prod] db migrate"
            node --env-file=.env.production.local src/db/migrate.mjs
            echo "▶ [prod] restart"
            sudo systemctl restart adventure-rpg
            sleep 2
            sudo systemctl --no-pager status adventure-rpg | head -n 4
            echo "▶ [prod] smoke — 라이브가 진짜 살아있는지 검증(실패 시 배포 빨간불 → rollback.sh)"
            ok=0
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/api/health || echo 000)
              if [ "$code" = "200" ]; then ok=1; echo "  health 200 (try $i)"; break; fi
              echo "  health $code — 부팅 대기 $i/20"; sleep 3
            done
            [ "$ok" = "1" ] || { echo "✗ SMOKE FAIL: /api/health 가 200 이 아님 (앱 미기동/DB 단절)"; exit 1; }
            sc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/sign-in || echo 000)
            [ "$sc" = "200" ] || { echo "✗ SMOKE FAIL: /sign-in → $sc"; exit 1; }
            echo "  /sign-in 200"
            CRON_SECRET=$(grep '^CRON_SECRET=' .env.production.local | cut -d= -f2- | tr -d '"')
            ops=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 -X POST -H "Authorization: Bearer $CRON_SECRET" http://127.0.0.1:3000/api/v2/cron/deploy-smoke || echo 000)
            [ "$ops" = "200" ] || { echo "✗ SMOKE FAIL: deploy-smoke → $ops"; exit 1; }
            echo "  deploy-smoke 200"
            echo "▶ [prod] nginx maintenance off"
            bash deploy/maintenance.sh off
            trap - EXIT
            echo "✓ [prod] smoke pass · done"
