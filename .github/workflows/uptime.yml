name: External uptime monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: external-uptime-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: msmsge.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Check full public release surface
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          # 명시적으로 유지 중인 점검 화면은 정상 운영 상태로 인정한다. 점검이
          # 해제된 상태에서는 기존과 동일하게 전체 공개 표면을 검사한다.
          PUBLIC_RELEASE_MAINTENANCE_POLICY: allow
          PUBLIC_RELEASE_RETRIES: "8"
          PUBLIC_RELEASE_RETRY_DELAY_MS: "20000"
        run: bash deploy/check-external-health.sh
