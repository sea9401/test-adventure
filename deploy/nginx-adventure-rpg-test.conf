# /etc/nginx/conf.d/test-msmsge.conf
# test.msmsge.com → 격리된 staging Next.js 인스턴스(127.0.0.1:3002).
limit_req_zone $binary_remote_addr zone=test_api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=test_page_per_ip:10m rate=60r/s;

server {
    listen 443 ssl;
    server_name test.msmsge.com;
    client_max_body_size 5m;

    ssl_certificate /etc/letsencrypt/live/test.msmsge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.msmsge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/|$)|wp-admin(?:/|$)|wp-content(?:/|$)|vendor/phpunit(?:/|$)) {
        return 444;
    }

    location /api/auth/ {
        limit_req zone=test_api_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=test_api_per_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=test_page_per_ip burst=180 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name test.msmsge.com;
    return 301 https://$host$request_uri;
}
