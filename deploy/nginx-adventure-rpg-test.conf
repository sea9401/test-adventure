# /etc/nginx/conf.d/test-msmsge.conf
# 폐기된 테스트 서버는 앱으로 프록시하지 않고 모든 외부 요청에 정적 503 안내를 반환한다.
server {
    listen 443 ssl;
    server_name test.msmsge.com;
    root /var/www/test-msmsge;

    ssl_certificate /etc/letsencrypt/live/test.msmsge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.msmsge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    error_page 503 /staging-closed.html;

    location = /staging-closed.html {
        internal;
    }

    location / {
        return 503;
    }
}

server {
    listen 80;
    server_name test.msmsge.com;
    return 301 https://$host$request_uri;
}
