# /etc/nginx/conf.d/test-msmsge.conf
# test.msmsge.com → 로컬 Next.js test 인스턴스(127.0.0.1:3002) 리버스 프록시.
# 아래는 `certbot --nginx -d test.msmsge.com` 실행 *전* 의 모습. certbot 이 listen 443 ssl /
# 인증서 경로 / 80→443 리다이렉트를 자동으로 덧붙인다.
limit_req_zone $binary_remote_addr zone=test_api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=test_page_per_ip:10m rate=60r/s;

server {
    listen 80;
    server_name test.msmsge.com;
    client_max_body_size 5m;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/|$)|wp-admin(?:/|$)|wp-content(?:/|$)|vendor/phpunit(?:/|$)) {
        return 444;
    }

    location /api/auth/ {
        limit_req zone=test_api_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=test_api_per_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=test_page_per_ip burst=180 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
