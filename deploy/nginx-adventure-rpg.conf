# /etc/nginx/conf.d/msmsge.conf
# 80/443 → 로컬 Next.js(127.0.0.1:3000) 리버스 프록시.
# 아래는 `certbot --nginx` 실행 *전* 의 모습. certbot 이 listen 443 ssl / 인증서 경로 /
# 80→443 리다이렉트를 자동으로 덧붙인다. (실제 서버 파일은 certbot 이 수정한 상태)
#
# 느슨한 비용 보호용 rate limit:
# - 정상 플레이/로그인 흐름은 거의 통과시키고, 봇 스캔·버그성 루프만 앞단에서 완화한다.
# - OAuth 콜백은 로그인 실패를 피하려고 일반 API보다 burst 를 크게 둔다.
#
# 명백한 스캐너 URL 은 Next.js 로 넘기지 않고 nginx 에서 즉시 차단한다.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=page_per_ip:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=life_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=heavy_per_ip:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name msmsge.com www.msmsge.com;
    include /etc/nginx/snippets/msmsge-canonical-host.conf;
    client_max_body_size 5m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    limit_conn conn_per_ip 30;
    limit_conn_status 429;
    include /etc/nginx/snippets/msmsge-maintenance-server.conf;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/|$)|wp-admin(?:/|$)|wp-content(?:/|$)|vendor/phpunit(?:/|$)) {
        return 444;
    }

    location ~* ^/api/v2/(?:fishing|woodcutting|mining|farm)/ {
        limit_req zone=life_per_ip burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/msmsge-maintenance-check.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location ~* ^/api/v2/(?:arena/match|grid-dungeon|me/offline-settle|outpost/attack|training/spar)/?$ {
        limit_req zone=heavy_per_ip burst=10 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 8;
        limit_conn_status 429;
        include /etc/nginx/snippets/msmsge-maintenance-check.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
    }

    location /api/auth/ {
        limit_req zone=api_per_ip burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/msmsge-maintenance-check.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/msmsge-maintenance-check.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=page_per_ip burst=180 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/msmsge-maintenance-check.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}
