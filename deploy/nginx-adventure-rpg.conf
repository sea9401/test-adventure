# /etc/nginx/conf.d/msmsge.conf
# 80/443 → 로컬 Next.js(127.0.0.1:3000) 리버스 프록시.
# 아래는 `certbot --nginx` 실행 *전* 의 모습. certbot 이 listen 443 ssl / 인증서 경로 /
# 80→443 리다이렉트를 자동으로 덧붙인다. (실제 서버 파일은 certbot 이 수정한 상태)
#
# 느슨한 비용 보호용 rate limit:
# - 정상 플레이/로그인 흐름은 거의 통과시키고, 봇 스캔·버그성 루프만 앞단에서 완화한다.
# - OAuth 콜백은 로그인 실패를 피하려고 일반 API보다 burst 를 크게 둔다.
#
# 명백한 스캐너 URL 은 Next.js 로 넘기지 않고 nginx 에서 즉시 차단한다.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=page_per_ip:10m rate=60r/s;

server {
    listen 80;
    server_name msmsge.com www.msmsge.com;
    client_max_body_size 5m;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/|$)|wp-admin(?:/|$)|wp-content(?:/|$)|vendor/phpunit(?:/|$)) {
        return 444;
    }

    location /api/auth/ {
        limit_req zone=api_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=page_per_ip burst=180 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
