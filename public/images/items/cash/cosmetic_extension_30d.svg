<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">꾸미기 30일 연장권</title>
  <desc id="desc">황금빛 갈색 타일 위 달력과 노란색 연장 화살표 아이콘</desc>

  <rect width="256" height="256" rx="54" fill="#92400e"/>
  <rect x="4" y="4" width="248" height="248" rx="50" fill="none" stroke="#fbbf24" stroke-width="4"/>

  <!-- 연장 화살표: 달력 뒤에서 아래와 오른쪽을 감싸도록 배치 -->
  <path
    d="M51 130c-4 48 31 86 78 86 52 0 88-37 88-88 0-28-11-51-31-67"
    fill="none"
    stroke="#2a0a5e"
