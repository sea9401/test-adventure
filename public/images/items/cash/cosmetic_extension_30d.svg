  <!-- 달력 -->
  <rect x="48" y="57" width="136" height="132" rx="24" fill="#fff8e8" stroke="#2a0a5e" stroke-width="8"/>
  <path d="M49 97h134" fill="none" stroke="#2a0a5e" stroke-width="8"/>

  <rect x="70" y="38" width="25" height="43" rx="12.5" fill="#fff8e8" stroke="#2a0a5e" stroke-width="8"/>
  <rect x="137" y="38" width="25" height="43" rx="12.5" fill="#fff8e8" stroke="#2a0a5e" stroke-width="8"/>

  <g fill="#5b1aa6">
    <rect x="68" y="113" width="27" height="25" rx="6"/>
    <rect x="103" y="113" width="27" height="25" rx="6"/>
    <rect x="138" y="113" width="27" height="25" rx="6"/>
    <rect x="68" y="147" width="27" height="25" rx="6"/>
    <rect x="103" y="147" width="27" height="25" rx="6"/>
    <rect x="138" y="147" width="27" height="25" rx="6"/>
  </g>

